name: Publish Release
"on":
  release:
    types:
      - published
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      target_commitish:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  PublishPackages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Echo Action
        run: echo "${{ github.event.action }}"
      - name: Echo Inputs
        run: |
          echo "tag_name = ${{ inputs.tag_name }}"
          echo "target_commitish = ${{ inputs.target_commitish }}"
          echo "sha = ${{ github.sha }}"
